[project]
name = "scrolly"
version = "0.2.5"
description = "CLI that compiles a JSON5 deck + slide files into a self-contained 2D-canvas HTML presentation."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Bert Pluymers", email = "bert.pluymers@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["presentation", "slides", "scrollytelling", "html", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "click>=8.2.0",
    "json5>=0.13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "markdown>=3.4",
    "pydantic>=2.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.14.0",
    "pre-commit>=4.0",
    # Exact pin: gitsvg is pre-1.0 and its output schema can shift
    # between releases. Used to regenerate the stacked-diffs example's
    # gitsvg frames.
    "gitsvg==0.2.3",
]
# Optional group for the hero-animation capture pipeline (docs/_gen).
# Heavy (Playwright ships browser binaries via `make capture-setup`),
# so it's separate from `dev` — casual contributors don't pay the cost.
capture = [
    "playwright>=1.40",
    "pillow>=10.0",
]

[project.scripts]
scrolly = "scrolly._cli._cli:cli"

[project.urls]
Homepage = "https://scrolly.readthedocs.io/en/stable/"
Documentation = "https://scrolly.readthedocs.io/en/stable/"
Source = "https://github.com/bertpl/scrolly"
Changelog = "https://github.com/bertpl/scrolly/blob/main/CHANGELOG.md"
Issues = "https://github.com/bertpl/scrolly/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["scrolly"]

[tool.hatch.build.targets.wheel]
packages = ["scrolly"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# The hero-animation engine lives under docs/_gen (dev-only tooling, not
# shipped in the wheel); put it on the path so its pure-logic unit tests
# can import it without the optional `capture` group installed.
pythonpath = ["docs/_gen"]

[tool.coverage.run]
source = ["scrolly"]

[tool.coverage.report]
precision = 2
exclude_also = [
    "@abstractmethod",
    "@abc.abstractmethod",
]
