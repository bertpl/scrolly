# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # The docs toolchain (MkDocs + Material + the gen-files / mkdocs-click
    # reference plugins).
    - requirements: docs/requirements.txt
    # scrolly itself — the auto-generated reference imports the CLI and the
    # element / error schemas from the installed package at build time.
    - method: pip
      path: .
