name: Unit test
description: |
  Set up Python + Node, install dependencies, and run pytest + vitest.

inputs:
  python-version:
    description: Python version. Empty string uses .python-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Install Python dependencies
      shell: bash
      run: uv sync --group dev

    - name: Install Node dependencies
      shell: bash
      run: npm ci

    - name: Run pytest
      shell: bash
      run: uv run pytest tests/python --durations=20

    - name: Run vitest
      shell: bash
      run: npx vitest run
